# SonarQube analysis for LokiShift (read by sonar-scanner from the repo root)
sonar.projectKey=lokishift
sonar.projectName=LokiShift
sonar.sourceEncoding=UTF-8

# Code that ships
sonar.sources=apps/backend/app,apps/frontend/app,apps/frontend/components,apps/frontend/lib
# Code that tests it
sonar.tests=apps/backend/tests

sonar.exclusions=**/node_modules/**,**/.next/**,**/*.css,apps/backend/data/**
sonar.python.version=3.13

# Coverage produced by the "Backend tests" stage (pytest --cov)
sonar.python.coverage.reportPaths=apps/backend/coverage.xml
sonar.python.xunit.reportPath=apps/backend/reports/pytest.xml

# The frontend has no unit tests yet, so leave it out of the coverage figure
# (it is still scanned for bugs, vulnerabilities and code smells).
sonar.coverage.exclusions=apps/frontend/**
